name: integration

# The live-API tier, and the only workflow that touches the real API. It is deliberately separate from
# `check.yml`: a `pull_request` from a fork gets no secrets by design, and `pull_request_target` — which would
# grant a fork author the base repo's token and secrets — is not used anywhere in this repo. `schedule` and
# `push` to `main` only ever run code from the default branch, so the key cannot be exfiltrated by a fork PR.
#
# This needs the JEV_API_KEY secret. Without it the live tier runs with no key and fails, so the nightly run is
# red on purpose until the secret is set.
on:
  schedule:
    # Nightly, 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6

      # Both gates are required: the Gradle property opts the suite in, and the SDK reads the key from
      # TYPESAFE_API_KEY. The repository secret is named JEV_API_KEY, so it is mapped here.
      # This job fails, and is meant to, when JEV_API_KEY is unset.
      - run: ./gradlew jvmTest -Ptypesafe.live=true
        env:
          TYPESAFE_API_KEY: ${{ secrets.JEV_API_KEY }}
